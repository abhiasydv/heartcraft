<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Journal Note</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .daily-container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            position: relative;
        }

        .journal-card {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            padding: 3.5rem;
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            max-width: 700px;
            width: 100%;
            z-index: 10;
        }

        .journal-header {
            border-bottom: 2px solid rgba(255, 77, 109, 0.2);
            padding-bottom: 1.5rem;
            margin-bottom: 2rem;
        }

        .journal-for {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--primary-color);
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .journal-title {
            font-family: var(--font-serif);
            font-size: clamp(2rem, 4vw, 3rem);
            color: var(--dark-accent);
            line-height: 1.2;
        }

        .journal-meta {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 1rem;
        }

        .journal-meta svg {
            width: 16px;
            height: 16px;
            color: var(--primary-color);
        }

        .journal-body {
            font-size: 1.15rem;
            line-height: 1.8;
            color: var(--text-main);
            white-space: pre-wrap; /* Keeps line breaks from textarea */
        }
    </style>
</head>
<body>
    <div class="bg-glow">
        <div class="glow-orb glow-1"></div>
        <div class="glow-orb glow-2" style="background: radial-gradient(circle, #e2d1ff 0%, transparent 70%);"></div>
    </div>

    <div class="daily-container">
        <div class="journal-card fade-in-element" id="journalCard">
            <div class="journal-header">
                <p class="journal-for" id="dFor">For You</p>
                <h1 class="journal-title" id="dTitle">My Day</h1>
                <div class="journal-meta">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                    <span id="dTime">Today</span>
                </div>
            </div>
            
            <div class="journal-body" id="dNotes">
                No notes provided.
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            
            if (!id) {
                // Backwards compatibility
                initDaily(params.get('name'), params.get('title'), params.get('notes'), params.get('time'));
            } else {
                try {
                    const { data: gift, error } = await supabase
                        .from('gifts')
                        .select('data')
                        .eq('id', id)
                        .single();
                        
                    if (error) throw error;
                    if (gift) {
                        initDaily(gift.data.name, gift.data.title, gift.data.notes, gift.data.time);
                    }
                } catch (err) {
                    console.error("Error fetching gift:", err);
                    alert("Could not load the journal. Are your database credentials correct?");
                }
            }

            function initDaily(name, title, notes, time) {
                name = name || '';
                title = title || 'A note from my day';
                notes = notes || 'Just thinking about you.';
                time = time || new Date().toLocaleString();

                if (name) {
                    document.getElementById('dFor').textContent = `For ${name} 🌹`;
                    document.title = `Note for ${name}`;
                }
                
                document.getElementById('dTitle').textContent = title;
                document.getElementById('dTime').textContent = time;
                document.getElementById('dNotes').textContent = notes;

                // Fade in animation
                setTimeout(() => {
                    document.getElementById('journalCard').classList.add('visible');
                }, 100);
            }
        });
    </script>
</body>
</html>
